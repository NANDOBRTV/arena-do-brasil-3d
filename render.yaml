services:
  - type: web
    name: arena-do-brasil-3d
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build && npm test
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIKTOK_USERNAME
        value: nandobr_ofc
      - key: TIKTOOL_API_KEY
        sync: false
      - key: EULERSTREAM_API_KEY
        sync: false